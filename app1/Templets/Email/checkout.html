<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Successfully Placed</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f4f5;
    font-family: Arial, sans-serif;
">

<table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="padding: 40px 15px;"
>
    <tr>
        <td align="center">

            <table
                width="600"
                cellpadding="0"
                cellspacing="0"
                style="
                    max-width: 600px;
                    width: 100%;
                    background: white;
                    border-radius: 10px;
                    overflow: hidden;
                "
            >

                <!-- HEADER -->

                <tr>
                    <td
                        style="
                            background: #111;
                            padding: 25px;
                            text-align: center;
                        "
                    >
                        <h1
                            style="
                                color: white;
                                margin: 0;
                                font-size: 24px;
                            "
                        >
                            STORE
                        </h1>
                    </td>
                </tr>

                <!-- CONTENT -->

                <tr>
                    <td style="padding: 40px;">

                        <h2
                            style="
                                margin: 0 0 20px;
                                color: #18181b;
                            "
                        >
                            Order Successfully Placed! ✓
                        </h2>

                        <p
                            style="
                                color: #52525b;
                                font-size: 16px;
                                line-height: 1.6;
                            "
                        >
                            Hi
                            {{ user.first_name|default:user.username }},
                        </p>

                        <p
                            style="
                                color: #52525b;
                                font-size: 16px;
                                line-height: 1.6;
                            "
                        >
                            Your order has been successfully placed.
                        </p>

                        <p
                            style="
                                color: #52525b;
                                font-size: 16px;
                                line-height: 1.6;
                            "
                        >
                            Thank you for shopping with us.
                        </p>

                    </td>
                </tr>

                <!-- FOOTER -->

                <tr>
                    <td
                        style="
                            background: #fafafa;
                            padding: 20px;
                            text-align: center;
                        "
                    >
                        <p
                            style="
                                margin: 0;
                                color: #71717a;
                                font-size: 13px;
                            "
                        >
                            © {% now "Y" %}  Store
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
